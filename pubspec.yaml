name: shirakawa_bot
description: 白川郷バスターミナル 音声案内チャットボット（プロトタイプ）
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 音声認識（第1段階：端末標準のエンジンを利用）
  speech_to_text: ^7.0.0

  # 用意した音声ファイルの再生
  audioplayers: ^6.1.0

  # 音声ファイルが無い回答を端末の音声合成で読み上げる
  flutter_tts: ^4.2.0

  # 詳細ページへのQRコード表示
  qr_flutter: ^4.1.0

  # FAQデータのオンライン取得
  http: ^1.2.2

  # 取得したデータを端末内に保存する場所を得る
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # FAQデータ・音声・画像をアプリに同梱
  assets:
    - assets/faq.json
    - assets/audio/
    - assets/character/
    - assets/photo/
